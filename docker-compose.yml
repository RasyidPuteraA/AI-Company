services:
  postgres:
    image: postgres:16
    container_name: ai_company_postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Tune postgres for a small low-traffic database on a memory-constrained host
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=32MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=256MB
      -c wal_buffers=4MB
      -c checkpoint_completion_target=0.9
      -c idle_in_transaction_session_timeout=30000
      -c statement_timeout=10000
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - ai_company_net
    mem_limit: 256m
    cpus: "0.5"

  redis:
    image: redis:7
    container_name: ai_company_redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./data/redis:/data
    networks:
      - ai_company_net
    mem_limit: 64m
    cpus: "0.1"

networks:
  ai_company_net:
    driver: bridge
